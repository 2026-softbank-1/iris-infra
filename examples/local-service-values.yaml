# 합의 전 예시. 이미지·host·Secret 참조는 실제 값으로 교체합니다.
image:
  repository: demo
  tag: commit-REPLACE_WITH_SHA
containerPort: 3000
service:
  port: 80
envSecretName: app-demo-env
health:
  path: /health
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
ingress:
  enabled: true
  className: traefik
  host: demo.localhost
