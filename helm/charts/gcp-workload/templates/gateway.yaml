apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: iris-gcp-apps
  annotations:
    networking.gke.io/certmap: {{ required "gateway.certificateMap is required" .Values.gateway.certificateMap | quote }}
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: {{ required "gateway.addressName is required" .Values.gateway.addressName | quote }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ printf "*.%s" .Values.gateway.baseDomain | quote }}
      allowedRoutes:
        namespaces: {from: Same}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ printf "*.%s" .Values.gateway.baseDomain | quote }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {iris.dev/target: gcp-dev-workload}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
spec:
  parentRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: iris-gcp-apps, sectionName: http}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
