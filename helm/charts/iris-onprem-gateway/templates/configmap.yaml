{{- $domain := trimPrefix "*." .Values.host }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: onprem-gateway
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {}
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      # 요청마다 이름을 풀어 egress Service 가 늦게 생겨도 nginx 가 뜬다.
      resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      map $http_x_forwarded_proto $forwarded_proto { default https; http http; https https; }
      # nginx wildcard server_name also matches nested labels; allow exactly one DNS label.
      map $host $allowed_host {
        default 0;
        "~^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.{{ $domain | regexQuoteMeta }}$" 1;
      }
      # A user-registered server's host ends with -{serverKey} (8 chars, first a letter); the iris-onprem-server
      # chart creates its egress Service. Legacy hosts end with -{service id}, a digit, and keep the fixed
      # upstream. Only the 8-char key reaches the upstream name, never the rest of the Host.
      map $host $onprem_upstream {
        default http://iris-onprem-apps.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.upstream.port }};
        "~^[a-z0-9-]+-(?<server_key>[a-z][a-z0-9]{7})\.{{ $domain | regexQuoteMeta }}$" http://iris-onprem-apps-$server_key.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.upstream.port }};
      }
      client_max_body_size 50m;
      # Host 가 IP 인 ALB health check / kubelet probe 와 매칭 안 되는 Host 는 여기서 끝낸다.
      server {
        listen 8080 default_server;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location / { return 404; }
      }
      server {
        listen 8080;
        server_name {{ .Values.host }};
        location = /healthz { access_log off; return 200 "ok\n"; }
        location / {
          if ($allowed_host = 0) { return 404; }
          proxy_pass $onprem_upstream;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_connect_timeout 5s;
          proxy_send_timeout 60s;
          proxy_read_timeout 60s;
        }
      }
    }
