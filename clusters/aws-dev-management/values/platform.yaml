# How each control plane component runs. Digests come from iris-gitops-environments
# platform/aws-dev-management/{repo}.yaml written by each repo's manual deploy workflow.
{
  "env": {
    "AWS_REGION": "ap-northeast-2",
    "LOG_LEVEL": "INFO"
  },
  "database": {
    "egressCidrs": [
      "10.40.0.0/20",
      "10.40.16.0/20"
    ]
  },
  "components": {
    "api": {
      "repository": "187069338876.dkr.ecr.ap-northeast-2.amazonaws.com/iris/was",
      "port": 8000,
      "migration": [
        "alembic",
        "upgrade",
        "head"
      ],
      "automountServiceAccountToken": false,
      "ingress": {
        "host": "api.likelion.uk",
        "groupName": "iris-platform-external"
      },
      "allowedCidrs": [
        "10.40.240.0/24",
        "10.40.241.0/24"
      ]
    },
    "build-worker": {
      "repository": "187069338876.dkr.ecr.ap-northeast-2.amazonaws.com/iris/was",
      "command": [
        "python",
        "-m",
        "app.workers.build_worker"
      ],
      "serviceAccountName": "build-worker",
      "env": {
        "CODEBUILD_PROJECT": "iris-dev-build",
        "ARTIFACT_BUCKET": "iris-dev-build-artifacts-187069338876-ap-northeast-2"
      }
    },
    "deploy-worker": {
      "repository": "187069338876.dkr.ecr.ap-northeast-2.amazonaws.com/iris/was",
      "command": [
        "python",
        "-m",
        "app.workers.deploy_worker"
      ],
      "serviceAccountName": "deploy-worker",
      "argocdEgress": true,
      "env": {
        "BASE_DOMAIN": "likelion.uk",
        "GITOPS_REPOSITORY": "2026-softbank-1/iris-gitops-environments",
        "ARGOCD_SERVER_URL": "https://argocd-server.argocd.svc"
      }
    }
  }
}
