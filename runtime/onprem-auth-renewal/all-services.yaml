# Unsuspend only after the migration and admission checks in README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iris-onprem-ecr-renewer
  namespace: iris-platform
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iris-onprem-ecr-renewer
  namespace: iris-platform
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - iris-onprem-ecr-renew-auth
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iris-onprem-ecr-renewer
  namespace: iris-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iris-onprem-ecr-renewer
subjects:
- kind: ServiceAccount
  name: iris-onprem-ecr-renewer
  namespace: iris-platform
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: iris-onprem-ecr-renewer
  namespace: iris-platform
spec:
  schedule: "* * * * *"
  timeZone: Asia/Seoul
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: iris-onprem-ecr-renewer
            iris.dev/auth-renewal: ecr
        spec:
          serviceAccountName: iris-onprem-ecr-renewer
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: renew
            image: 187069338876.dkr.ecr.ap-northeast-2.amazonaws.com/iris/was@sha256:0cb2d386d551851f053d072068ccdd0ae0d358f18f00b9665d327a2882658029
            command:
            - python
            - /code/refresh.py
            env:
            - name: MODE
              value: ecr-all
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AUTH_SECRET
              value: iris-onprem-ecr-renew-auth
            - name: AWS_DEFAULT_REGION
              value: ap-northeast-2
            - name: AWS_EC2_METADATA_DISABLED
              value: 'true'
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: code
              mountPath: /code
              readOnly: true
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: code
            configMap:
              name: iris-onprem-auth-renewal-code
              defaultMode: 292
          - name: tmp
            emptyDir:
              sizeLimit: 16Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iris-onprem-ecr-renewer
  namespace: iris-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: iris-onprem-ecr-renewer
      iris.dev/auth-renewal: ecr
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: 10.40.0.0/16
    - ipBlock:
        cidr: 172.20.0.1/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tailscale
      podSelector:
        matchLabels:
          iris.dev/proxy: onprem-api
    ports:
    - protocol: TCP
      port: 6443
  - to:
    - ipBlock:
        cidr: 169.254.170.23/32
    ports:
    - protocol: TCP
      port: 80
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.40.0.0/16
        - 172.20.0.0/16
        - 169.254.0.0/16
    ports:
    - protocol: TCP
      port: 443
