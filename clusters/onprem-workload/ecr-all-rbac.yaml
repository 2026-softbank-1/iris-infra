# Extend the EXISTING svc-28 renewal identity; no SA or API token bootstrap.
# Validate ecr-all-admission.yaml before granting the last binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: iris-onprem-ecr-renewer}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [iris-ecr-pull]
    verbs: [get, patch]
  # CREATE cannot be restricted by resourceNames. Admission enforces name/ns/type.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [default]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [app]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: iris-onprem-ecr-renewer}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: iris-onprem-ecr-renewer}
subjects:
  - {kind: ServiceAccount, name: iris-ecr-renewer, namespace: svc-28}
