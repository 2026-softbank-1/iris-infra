{{- range .Values.namespaces }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  labels:
    iris.dev/managed-by: baseline
    pod-security.kubernetes.io/enforce: {{ if eq . "observability" }}privileged{{ else }}baseline{{ end }}
    pod-security.kubernetes.io/enforce-version: v1.35
---
{{- end }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: {{ .Values.storageClass.reclaimPolicy }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: application-budget
  namespace: {{ .Values.applicationNamespace }}
spec:
  hard:
    {{- toYaml .Values.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: application-defaults
  namespace: {{ .Values.applicationNamespace }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-boundary
  namespace: {{ .Values.applicationNamespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Pod Identity SDK uses the node agent HTTP endpoint, not EC2 IMDS.
    - to:
        - ipBlock: {cidr: 169.254.170.23/32}
      ports:
        - {protocol: TCP, port: 80}
    # AWS APIs, remote Kubernetes API and external HTTPS dependencies.
    - ports:
        - {protocol: TCP, port: 443}
{{- end }}
{{- with .Values.externalAlb }}{{ if .enabled }}
---
# Anchor for the shared internet-facing ALB: keeps the ALB (and its DNS name) alive while
# no app Ingress exists, owns group-wide settings, and answers unknown hosts with 404.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .groupName }}-anchor
  namespace: {{ $.Values.applicationNamespace }}
  annotations:
    alb.ingress.kubernetes.io/group.name: {{ .groupName | quote }}
    alb.ingress.kubernetes.io/group.order: "1000"
    alb.ingress.kubernetes.io/load-balancer-name: {{ .groupName | quote }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: {{ .certificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/actions.not-found: >-
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"404","messageBody":"not found"}}
spec:
  ingressClassName: alb
  defaultBackend:
    service:
      name: not-found
      port:
        name: use-annotation
{{- end }}{{ end }}
