apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: iris-onprem-http
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  statefulSet:
    pod:
      labels: {iris.dev/proxy: onprem-http}
      tailscaleContainer:
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iris-onprem-http
  namespace: tailscale
spec:
  podSelector:
    matchLabels: {iris.dev/proxy: onprem-http}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: onprem-gateway}}
          podSelector: {matchLabels: {app.kubernetes.io/name: onprem-gateway}}
      ports: [{protocol: TCP, port: 80}]
---
# Kubernetes API egress proxies of user-registered servers (argocd/iris-onprem-api-{serverKey}, iris-onprem-server chart).
# Shared by every server, so it lives here and not in the per-server chart. The legacy VM's hand-made ProxyClass
# iris-onprem-api, its NetworkPolicy iris-onprem-api-ingress and pod label onprem-api stay untouched.
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: iris-onprem-server-api
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  statefulSet:
    pod:
      labels: {iris.dev/proxy: onprem-server-api}
      tailscaleContainer:
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iris-onprem-server-api
  namespace: tailscale
spec:
  podSelector:
    matchLabels: {iris.dev/proxy: onprem-server-api}
  policyTypes: [Ingress]
  # Only Argo CD's application controller and server talk to registered clusters (same scope as the legacy proxy).
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: argocd}}
          podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [argocd-application-controller, argocd-server]}
      ports: [{protocol: TCP, port: 6443}]
