{{- with .Values.variables }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "iris-service.labels" $ | nindent 4 }}
  annotations:
    # Secret 이 Rollout(wave 0)보다 먼저 만들어지게 합니다. 복호화에 실패하면 SealedSecret 이
    # Degraded 가 되어 이 wave 에서 sync 가 멈추고, Pod 은 새로 뜨지 않습니다.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Deploy Worker 가 strict scope(namespace svc-{service_id} + 이 이름)로 봉인한 값입니다.
  encryptedData:
    {{- toYaml .encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ .name }}
      labels:
        {{- include "iris-service.labels" $ | nindent 8 }}
    type: Opaque
{{- end }}
