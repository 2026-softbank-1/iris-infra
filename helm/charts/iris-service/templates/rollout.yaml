{{- $strategy := include "iris-service.deploymentStrategy" . }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: app
  labels:
    {{- include "iris-service.labels" . | nindent 4 }}
  annotations:
    # Deploy Worker 가 고른 방식과 Pod 수 때문에 실제로 렌더링한 방식입니다.
    iris/deployment-strategy: {{ $strategy }}
spec:
  replicas: {{ .Values.replicas }}
  # 이 시간 안에 새 Pod 가 진행하지 못하면 abort 해 이전 Pod 로 되돌리고 Degraded 가 됩니다.
  # Deploy Worker 는 Degraded 를 실패로 판정합니다. pause 중에는 시간을 세지 않습니다.
  progressDeadlineSeconds: {{ .Values.health.timeoutSeconds }}
  progressDeadlineAbort: true
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "iris-service.selectorLabels" . | nindent 6 }}
  strategy:
    {{- if eq $strategy "BLUE_GREEN" }}
    # 새 묶음을 replicas 만큼 모두 Ready 로 띄우고 30초 뒤 Service 를 새 묶음으로 바꿉니다.
    # 이전 묶음은 30초 더 두었다가 내립니다. Service·Ingress 는 하나뿐이라 preview Service 는 없습니다.
    blueGreen:
      activeService: app
      autoPromotionEnabled: true
      autoPromotionSeconds: 30
      scaleDownDelaySeconds: 30
    {{- else }}
    # traffic routing 없는 canary 입니다. steps 가 없으면 Deployment 의 RollingUpdate 와 같습니다.
    canary:
      maxSurge: 1
      maxUnavailable: 0
      {{- if eq $strategy "CANARY" }}
      # 새 Pod 를 정확히 1개 띄우고 60초 본 뒤 나머지를 위 surge 규칙으로 바꿉니다.
      # controller(v1.10.0)는 weight 를 replicas·replicas+1 중 가장 가까운 Pod 수로 맞춥니다.
      # floor(100/replicas) 는 2~10 개에서 새 Pod 1개가 됩니다(helm-check 가 같은 계산으로 검사).
      steps:
        - setWeight: {{ div 100 (int .Values.replicas) }}
        - pause: {duration: 60s}
      {{- end }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "iris-service.selectorLabels" . | nindent 8 }}
        # 로그·메트릭을 release 단위로 묶는 라벨입니다(OTel k8sattributes → Loki iris_release_id).
        # selector 에는 넣지 않습니다(Rollout selector 는 바꿀 수 없습니다).
        iris/release-id: {{ .Values.release.id | quote }}
      annotations:
        # digest 가 같아도 release 마다 rollout 되게 합니다.
        iris/release-id: {{ .Values.release.id | quote }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: {{ include "iris-service.image" . | quote }}
          {{- with .Values.command }}
          # 이미지의 ENTRYPOINT·CMD 를 exec form 으로 덮어씁니다.
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          # env 가 사용자 변수(envFrom)보다 우선하므로 아래 값은 덮어쓸 수 없습니다.
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            - name: IRIS_PUBLIC_DOMAIN
              value: {{ .Values.route.host | quote }}
            {{- with .Values.release.sourceSha }}
            - name: IRIS_GIT_COMMIT_SHA
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.iris }}
            {{- with .serviceName }}
            - name: IRIS_SERVICE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .targetName }}
            - name: IRIS_TARGET_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .deploymentId }}
            - name: IRIS_DEPLOYMENT_ID
              # JSON 숫자는 float64 라 큰 값이 1e+06 꼴로 찍히지 않게 정수로 바꿉니다.
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.variables }}
          # 사용자 변수(SealedSecret 이 푼 Secret). 위 env 가 우선하므로 PORT·IRIS_* 는 덮어쓸 수 없습니다.
          envFrom:
            - secretRef:
                name: {{ .name }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            {{- if .Values.health.path }}
            httpGet:
              path: {{ .Values.health.path | quote }}
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.route.host | quote }}
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            periodSeconds: 5
