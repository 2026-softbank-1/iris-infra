{{- /* User services (ADR 0002): one Application per services/{id}/prod directory in the GitOps repo. */}}
{{- $workload := .Values.targets.workload }}
{{- $chartRepo := .Values.repoURL }}
{{- $s := .Values.services }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: iris-svc-project
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  sourceRepos:
    - {{ $chartRepo | quote }}
    - {{ $s.repoURL | quote }}
  destinations:
    - server: {{ $workload.endpoint | quote }}
      namespace: svc-*
    {{- if $s.onprem.enabled }}
    - server: {{ $s.onprem.server | quote }}
      namespace: svc-*
    {{- end }}
    {{- if $.Values.onpremServers.enabled }}
    # User-registered servers: Argo cluster names onprem-{serverKey} (templates/onprem-servers.yaml).
    - name: onprem-*
      namespace: svc-*
    {{- end }}
  # Allow chart resources and workload children so Argo can display ReplicaSets and Pods.
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
  namespaceResourceWhitelist:
    # Rollout runs the app since chart 0.7.0 (AWS). Deployment stays for the 0.6.0 chart on-prem and so Argo can prune it on AWS.
    - {group: argoproj.io, kind: Rollout}
    - {group: apps, kind: Deployment}
    - {group: apps, kind: ReplicaSet}
    # 개발용 데이터베이스(chart 0.9.0 workload.kind database). PVC·ControllerRevision 은 StatefulSet controller 가
    # 만들며 Argo 리소스 트리 표시용입니다.
    - {group: apps, kind: StatefulSet}
    - {group: apps, kind: ControllerRevision}
    - {group: "", kind: PersistentVolumeClaim}
    # DB 초기화 스크립트(database.initScripts) ConfigMap app-initdb.
    - {group: "", kind: ConfigMap}
    - {group: "", kind: Pod}
    - {group: "", kind: Service}
    - {group: networking.k8s.io, kind: Ingress}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    # 사용자 변수. Sealed Secrets controller 가 같은 namespace 에 Secret 으로 풉니다.
    - {group: bitnami.com, kind: SealedSecret}
  roles:
    # Deploy Worker reads Application status with this role's token.
    - name: iris-deploy-reader
      policies:
        - p, proj:iris-svc-project:iris-deploy-reader, applications, get, iris-svc-project/*, allow
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: iris-svc-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ $s.repoURL | quote }}
        revision: {{ $s.revision | quote }}
        directories:
          - path: services/*/prod
  syncPolicy:
    # Removing services/{id}/prod deletes its Application. Only the Deploy Worker removes directories
    # (REMOVE job, iris-was ADR 0016); people do not edit services/ by hand.
    applicationsSync: sync
  template:
    metadata:
      name: 'svc-{{ "{{" }} index .path.segments 1 {{ "}}" }}'
      # Deleting the Application also deletes its workload resources. Without the finalizer they are
      # orphaned in the workload cluster.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: iris-svc-project
      sources:
        - repoURL: {{ $chartRepo | quote }}
          path: helm/charts/iris-service
          targetRevision: {{ $s.chartRevision | quote }}
          helm:
            valueFiles:
              - '$values/{{ "{{" }} .path.path {{ "}}" }}/values.yaml'
        - repoURL: {{ $s.repoURL | quote }}
          targetRevision: {{ $s.revision | quote }}
          ref: values
      destination:
        server: {{ $workload.endpoint | quote }}
        namespace: 'svc-{{ "{{" }} index .path.segments 1 {{ "}}" }}'
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        # PruneLast deletes removed resources only after the rest of the sync is Healthy: the 0.6.0
        # Deployment goes away after the 0.7.0 Rollout serves, and old SealedSecrets after new Pods start.
        syncOptions: [CreateNamespace=true, PruneLast=true]
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: baseline
            # Rollouts wait for ALB target health.
            elbv2.k8s.aws/pod-readiness-gate-inject: enabled
{{- if $s.onprem.enabled }}
{{- $o := $s.onprem }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: iris-svc-onprem-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ $s.repoURL | quote }}
        revision: {{ $s.revision | quote }}
        directories:
          - path: services/*/onprem
  syncPolicy:
    applicationsSync: sync
  template:
    metadata:
      name: 'svc-{{ "{{" }} index .path.segments 1 {{ "}}" }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: iris-svc-project
      sources:
        # on-prem has no Argo Rollouts controller, so it keeps its own chart pin on the Deployment-based
        # 0.6.0 (rolling only). The Deploy Worker never writes deploymentStrategy for on-prem targets.
        - repoURL: {{ $chartRepo | quote }}
          path: helm/charts/iris-service
          targetRevision: {{ $o.chartRevision | quote }}
          helm:
            valueFiles:
              - '$values/{{ "{{" }} .path.path {{ "}}" }}/values.yaml'
            valuesObject:
              route: {className: {{ $o.ingressClassName | quote }}}
              networkPolicy: {egressDeniedCidrs: {{ toJson $o.egressDeniedCidrs }}}
        - repoURL: {{ $s.repoURL | quote }}
          targetRevision: {{ $s.revision | quote }}
          ref: values
      destination:
        server: {{ $o.server | quote }}
        namespace: 'svc-{{ "{{" }} index .path.segments 1 {{ "}}" }}'
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, PruneLast=true]
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: baseline
{{- end }}
