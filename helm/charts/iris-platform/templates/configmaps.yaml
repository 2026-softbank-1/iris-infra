{{- $api := dict "LOG_LEVEL" .Values.was.logLevel }}
{{- /* Control API reads build logs only when a log group is set; an empty value would count as configured. */}}
{{- if .Values.api.buildLogGroup }}{{- $api = merge $api (dict "AWS_REGION" .Values.awsRegion "BUILD_LOG_GROUP" .Values.api.buildLogGroup) }}{{- end }}
{{- /* The API hands out the Console Gateway address only once a Gateway digest is deployed. The Gateway shares the API host (path routing). */}}
{{- if and .Values.consoleGateway.enabled .Values.consoleGateway.digest }}{{- $api = merge $api (dict "CONSOLE_GATEWAY_HTTP_URL" (printf "https://%s" .Values.api.host) "CONSOLE_GATEWAY_WS_URL" (printf "wss://%s" .Values.api.host)) }}{{- end }}
{{- $configs := dict "api" $api "build-worker" (dict "LOG_LEVEL" .Values.was.logLevel "AWS_REGION" .Values.awsRegion "CODEBUILD_PROJECT" .Values.buildWorker.codebuildProject "ARTIFACT_BUCKET" .Values.buildWorker.artifactBucket) "deploy-worker" (dict "LOG_LEVEL" .Values.was.logLevel "AWS_REGION" .Values.awsRegion "BASE_DOMAIN" .Values.deployWorker.baseDomain "GITOPS_REPOSITORY" .Values.deployWorker.gitopsRepository "ARGOCD_SERVER_URL" .Values.deployWorker.argocdUrl "SSL_CERT_FILE" "/etc/iris-argocd/ca-bundle.pem") }}
{{- if .Values.errorAgent.enabled }}{{- $_ := set $configs "error-agent" (merge (dict "LLM_MODEL" .Values.errorAgent.model) (.Values.errorAgent.env | default dict)) }}{{- end }}
{{- /* Console Gateway: no DB, no secret. The ticket verification key and the workload cluster endpoint/CA are public values. */}}
{{- if .Values.consoleGateway.enabled }}{{- $_ := set $configs "console-gateway" (dict "LOG_LEVEL" .Values.was.logLevel "AWS_REGION" .Values.awsRegion "CONSOLE_TICKET_PUBLIC_KEY" .Values.consoleGateway.ticketPublicKey "CONSOLE_AWS_CLUSTER_NAME" .Values.consoleGateway.awsCluster.name "CONSOLE_AWS_CLUSTER_ENDPOINT" .Values.consoleGateway.awsCluster.endpoint "CONSOLE_AWS_CLUSTER_CA" .Values.consoleGateway.awsCluster.ca "CONSOLE_ALLOWED_ORIGINS" (join "," .Values.consoleGateway.allowedOrigins) "CONSOLE_IDLE_TIMEOUT_SECONDS" .Values.consoleGateway.idleTimeoutSeconds "CONSOLE_MAX_SESSION_SECONDS" .Values.consoleGateway.maxSessionSeconds "CONSOLE_MAX_SESSIONS_PER_USER" .Values.consoleGateway.maxSessionsPerUser) }}{{- end }}
{{- range $component, $data := $configs }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "iris-platform.labels" $ | nindent 4 }}
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
