{{- /* GitHub push webhooks for Argo CD and the ApplicationSet controller (docs/runbooks/argocd-webhook.md).
     Its own project: it may create Ingresses in argocd and nothing else. */}}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: iris-argocd-webhook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  sourceRepos:
    - {{ .Values.repoURL | quote }}
  destinations:
    - server: {{ .Values.targets.management.endpoint | quote }}
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: networking.k8s.io, kind: Ingress}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iris-argocd-webhook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: iris-argocd-webhook
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: helm/charts/iris-argocd-webhook
    helm:
      releaseName: argocd-webhook
      valueFiles: [../../../clusters/aws-dev-management/values/argocd-webhook.yaml]
  destination:
    server: {{ .Values.targets.management.endpoint | quote }}
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
