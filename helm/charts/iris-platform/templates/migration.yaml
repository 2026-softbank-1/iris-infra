{{- if .Values.api.digest }}
# PreSync: runs once per sync before any component rolls out (iris-was rule: no migration at app start).
# alembic upgrade head is idempotent; schema changes ship with the api image.
apiVersion: batch/v1
kind: Job
metadata:
  name: iris-db-migration
  labels:
    {{- include "iris-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iris-db-migration
        app.kubernetes.io/part-of: iris-platform
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.api.serviceAccountName }}
      securityContext:
        {{- include "iris-platform.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "iris-platform.image" (dict "root" . "digest" .Values.api.digest) | quote }}
          command:
            {{- toYaml .Values.migration.command | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.api.secretName }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            {{- include "iris-platform.securityContext" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
