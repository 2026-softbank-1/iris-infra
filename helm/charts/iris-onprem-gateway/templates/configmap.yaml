apiVersion: v1
kind: ConfigMap
metadata:
  name: onprem-gateway
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      # 요청마다 이름을 풀어 egress Service 가 늦게 생겨도 nginx 가 뜬다.
      resolver kube-dns.kube-system.svc.cluster.local valid=30s;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      client_max_body_size 50m;
      # Host 가 IP 인 ALB health check / kubelet probe 와 매칭 안 되는 Host 는 여기서 끝낸다.
      server {
        listen 8080 default_server;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location / { return 404; }
      }
      server {
        listen 8080;
        server_name {{ .Values.host }};
        location / {
          set $upstream http://iris-onprem-apps.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.upstream.port }};
          proxy_pass $upstream;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 60s;
        }
      }
    }
