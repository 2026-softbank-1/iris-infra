# Bootstrap on the on-prem VM only, AFTER ecr-all-admission.yaml has been checked.
# Keep the ClusterRoleBinding last; do not grant it on unsupported K3s versions.
apiVersion: v1
kind: Namespace
metadata: {name: iris-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: iris-ecr-renewer, namespace: iris-system}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: iris-ecr-renewer-self-token, namespace: iris-system}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [iris-ecr-renewer]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: iris-ecr-renewer-self-token, namespace: iris-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: iris-ecr-renewer-self-token}
subjects:
  - {kind: ServiceAccount, name: iris-ecr-renewer, namespace: iris-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: iris-onprem-ecr-renewer}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [iris-ecr-pull]
    verbs: [get, patch]
  # CREATE cannot be restricted by resourceNames. Admission enforces name/ns/type.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [default]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [app]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: iris-onprem-ecr-renewer}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: iris-onprem-ecr-renewer}
subjects:
  - {kind: ServiceAccount, name: iris-ecr-renewer, namespace: iris-system}
