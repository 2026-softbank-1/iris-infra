{
  "deploymentMode": "SingleBinary",
  "loki": {
    "auth_enabled": false,
    "commonConfig": {
      "replication_factor": 1
    },
    "schemaConfig": {
      "configs": [
        {
          "from": "2026-10-01",
          "store": "tsdb",
          "object_store": "s3",
          "schema": "v13",
          "index": {
            "prefix": "index_",
            "period": "24h"
          }
        }
      ]
    },
    "storage": {
      "type": "s3",
      "bucketNames": {
        "chunks": "iris-dev-loki-187069338876-ap-northeast-2",
        "ruler": "iris-dev-loki-187069338876-ap-northeast-2"
      },
      "s3": {
        "region": "ap-northeast-2"
      }
    },
    "compactor": {
      "retention_enabled": true,
      "delete_request_store": "s3"
    },
    "limits_config": {
      "retention_period": "168h",
      "per_stream_rate_limit": "256KB",
      "per_stream_rate_limit_burst": "1MB",
      "otlp_config": {
        "resource_attributes": {
          "attributes_config": [
            {
              "action": "index_label",
              "attributes": [
                "iris.release_id"
              ]
            }
          ]
        }
      }
    },
    "image": {
      "registry": "docker.io",
      "repository": "grafana/loki",
      "tag": "3.6.12@sha256:2483b71b28b15dee230f85512cae2b20c4b5f6e98a6eabe686cbccfa5ea3ba4a"
    }
  },
  "serviceAccount": {
    "name": "loki"
  },
  "singleBinary": {
    "replicas": 1,
    "persistence": {
      "storageClass": "gp3",
      "size": "10Gi"
    },
    "resources": {
      "requests": {
        "cpu": "200m",
        "memory": "512Mi"
      },
      "limits": {
        "memory": "2Gi"
      }
    }
  },
  "read": {
    "replicas": 0
  },
  "write": {
    "replicas": 0
  },
  "backend": {
    "replicas": 0
  },
  "gateway": {
    "enabled": false
  },
  "chunksCache": {
    "enabled": false
  },
  "resultsCache": {
    "enabled": false
  },
  "lokiCanary": {
    "enabled": false
  },
  "test": {
    "enabled": false
  },
  "sidecar": {
    "rules": {
      "enabled": false
    }
  }
}
