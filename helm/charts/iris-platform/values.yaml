# 세 컴포넌트는 iris-was 이미지 하나(iris/was)를 쓰고 command 만 다릅니다.
# digest 는 iris-was 의 수동 배포 workflow 가 iris-gitops-environments 의
# platform/aws-dev-management/values.yaml 에 씁니다. digest 가 비어 있는 컴포넌트는 배포하지 않습니다.
# 비밀값은 여기 두지 않고 secretName 의 Secret(운영자가 생성)을 envFrom 으로 읽습니다.
imageRepository: ""
# 모든 컴포넌트에 넣는 비밀이 아닌 공통 환경변수
env: {}

api:
  digest: ""
  replicas: 1
  port: 8000
  secretName: iris-api-env
  serviceAccountName: iris-api
  env: {}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  ingress:
    host: ""
    groupName: iris-platform-external
  # ALB(target-type ip)가 Pod 로 보내는 출발지. 비어 있으면 ALB 인바운드를 열지 않습니다.
  allowedCidrs: []

buildWorker:
  digest: ""
  replicas: 1
  command: ["python", "-m", "app.workers.build_worker"]
  secretName: iris-build-worker-env
  # management stack 의 Pod Identity association 과 같은 이름이어야 합니다.
  serviceAccountName: build-worker
  env: {}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

deployWorker:
  digest: ""
  replicas: 1
  command: ["python", "-m", "app.workers.deploy_worker"]
  secretName: iris-deploy-worker-env
  serviceAccountName: deploy-worker
  env: {}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  # Argo CD API(argocd-server) 로 나가는 egress
  argocd:
    namespace: argocd
    port: 8080

# api digest 가 있을 때 api 이미지로 alembic upgrade head 를 실행합니다.
migration:
  command: ["alembic", "upgrade", "head"]
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

# Platform RDS(foundation database.tf). DATABASE_URL 은 각 컴포넌트 Secret 에 있습니다.
# 비어 있으면 DB egress 를 열지 않습니다(baseline 정책은 443·DNS 만 허용).
database:
  egressCidrs: []
  port: 5432
