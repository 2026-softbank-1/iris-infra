{{- if .Values.errorAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-error-agent
  labels:
    {{- include "iris-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: error-agent
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: error-agent
  template:
    metadata:
      annotations:
        checksum/config: {{ toJson .Values.errorAgent | sha256sum | quote }}
      labels:
        {{- include "iris-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: error-agent
    spec:
      serviceAccountName: {{ .Release.Name }}-error-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: error-agent
          image: {{ printf "%s@%s" .Values.errorAgent.image.repository .Values.errorAgent.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          command: [python, -m, ai_error_check_agent.api, --host, 0.0.0.0, --port, "8001"]
          ports:
            - {name: http, containerPort: 8001}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-error-agent}
          env:
            {{- range $key := list "LLM_API_KEY" "AGENT_API_KEY" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: {name: {{ $.Values.errorAgent.secret | quote }}, key: {{ $key }}}
            {{- end }}
          resources:
            {{- toYaml .Values.errorAgent.resources | nindent 12 }}
          securityContext:
            {{- include "iris-platform.security" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-error-agent
  labels:
    {{- include "iris-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: error-agent
  ports:
    - {name: http, port: 8001, targetPort: http}
{{- end }}
