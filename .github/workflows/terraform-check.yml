name: Terraform CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_apply:
        description: Apply on main after validation (explicit deployment approval)
        type: boolean
        default: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tf_check: ${{ steps.changes.outputs.tf_check }}
      tf_apply: ${{ steps.changes.outputs.tf_apply }}
      collector_check: ${{ steps.changes.outputs.collector_check }}
      helm_check: ${{ steps.changes.outputs.helm_check }}
      platform_check: ${{ steps.changes.outputs.platform_check }}
      ops_check: ${{ steps.changes.outputs.ops_check }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify infrastructure inputs
        id: changes
        env:
          FORCE_APPLY: ${{ inputs.force_apply }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/terraform-ci-changes.py

  check:
    # Keep this required status even when all expensive checks are unnecessary.
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    concurrency:
      # A later docs-only main push must not cancel checks for deployable inputs.
      # PR updates can still replace the earlier check on the same pull request.
      group: terraform-check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Require successful change detection
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read Terraform version
        if: needs.changes.outputs.tf_check == 'true'
        id: terraform-version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < .terraform-version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        if: needs.changes.outputs.tf_check == 'true'
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false
      - name: Scaffold checks
        run: make scaffold-check
      - name: Test Terraform CI stack orchestration
        if: needs.changes.outputs.tf_check == 'true'
        run: python3 scripts/tests/test-tf-ci.py
      - name: Test ALB collector outbox and parsing
        if: needs.changes.outputs.collector_check == 'true'
        run: python3 -m unittest discover -s collectors/alb-access-logs -p test_collector.py
      - name: Install verified linters in runner temp
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/platform-ecr-tools"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tool_dir/actionlint.tar.gz"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$tool_dir/actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$tool_dir/actionlint.tar.gz" --directory "$tool_dir" actionlint
          curl --fail --location --retry 3 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz \
            --output "$tool_dir/shellcheck.tar.gz"
          printf '%s  %s\n' \
            b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 \
            "$tool_dir/shellcheck.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$tool_dir/shellcheck.tar.gz" --directory "$tool_dir" shellcheck-v0.11.0/shellcheck
          printf '%s\n' "$tool_dir" "$tool_dir/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Test platform inventory and build script behavior
        if: needs.changes.outputs.platform_check == 'true'
        run: |
          python3 scripts/tests/test-platform-ecr.py
          python3 scripts/tests/test-build-push-ecr.py
      - name: Test CI change conditions
        run: |
          python3 scripts/tests/test-collector-ci.py
          python3 scripts/tests/test-terraform-ci-changes.py
      - name: Lint workflows and Bash script
        run: |
          bash -n examples/github-actions/build-push-ecr.sh
          shellcheck -x scripts/*.sh examples/github-actions/build-push-ecr.sh
          actionlint .github/workflows/terraform-check.yml .github/workflows/alb-log-collector.yml examples/github-actions/build-push-ecr.yml
      - uses: docker/setup-buildx-action@v3
        if: needs.changes.outputs.platform_check == 'true'
      - name: Build local scratch fixture without AWS credentials
        if: needs.changes.outputs.platform_check == 'true'
        env:
          IRIS_ECR_DOCKER_TEST: '1'
        run: python3 scripts/tests/test-build-push-ecr.py BuildPushTest.test_real_docker_fixture_build
      - name: Install verified Loki for ruler or Helm validation
        if: >-
          needs.changes.outputs.collector_check == 'true' ||
          needs.changes.outputs.helm_check == 'true'
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/alb-traffic-tools"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 \
            https://github.com/grafana/loki/releases/download/v3.6.12/loki-linux-amd64.zip \
            --output "$tool_dir/loki.zip"
          printf '%s  %s\n' \
            301a56770f8bee5a1634dd40b83b6a8975f8b45706d6b18888d7cc0999e79d86 \
            "$tool_dir/loki.zip" | sha256sum --check
          unzip -q "$tool_dir/loki.zip" -d "$tool_dir"
          chmod +x "$tool_dir/loki-linux-amd64"
      - name: Verify actual Loki ruler and Prometheus traffic results
        if: needs.changes.outputs.collector_check == 'true'
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/alb-traffic-tools"
          curl --fail --location --retry 3 \
            https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz \
            --output "$tool_dir/prometheus.tar.gz"
          printf '%s  %s\n' \
            2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0 \
            "$tool_dir/prometheus.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$tool_dir/prometheus.tar.gz" --directory "$tool_dir"
          python3 collectors/alb-access-logs/integration.py \
            --loki-binary "$tool_dir/loki-linux-amd64" \
            --prometheus-binary "$tool_dir/prometheus-3.15.0.linux-amd64/prometheus"
      - name: Format, init without backend, and validate
        if: needs.changes.outputs.tf_check == 'true'
        run: make tf-check
      - name: Test all implemented Terraform stacks with isolated mock providers
        if: needs.changes.outputs.tf_check == 'true'
        run: bash scripts/terraform-test.sh
      - name: Test private API operations and foundation plan protection
        if: needs.changes.outputs.ops_check == 'true'
        run: python3 scripts/tests/test-eks-ops.py
      - name: Test on-prem namespace ECR reconciliation without cloud credentials
        if: needs.changes.outputs.ops_check == 'true'
        run: |
          python3 -m pip install httpx==0.28.1 PyYAML==6.0.3
          python3 -m unittest discover -s runtime/onprem-auth-renewal -p 'test_*.py'
      - name: Test IAM permission checker with fake AWS responses
        if: needs.changes.outputs.ops_check == 'true'
        run: python3 scripts/tests/test-eks-ci-permissions.py
      - uses: azure/setup-helm@v4.3.1
        if: needs.changes.outputs.helm_check == 'true'
        with:
          version: v3.19.1
      - name: Install manifest parser
        if: needs.changes.outputs.helm_check == 'true'
        run: python3 -m pip install PyYAML==6.0.3
      - name: Lint and render pinned Kubernetes stack
        if: needs.changes.outputs.helm_check == 'true'
        run: make helm-check
      - name: Render staged and fixture-enabled ALB traffic charts
        if: needs.changes.outputs.helm_check == 'true'
        run: python3 scripts/check-alb-traffic.py --loki-binary "$RUNNER_TEMP/alb-traffic-tools/loki-linux-amd64"
      - name: Test empty and pinned collector digest gates in isolated fixtures
        if: needs.changes.outputs.helm_check == 'true'
        run: python3 scripts/tests/test-alb-traffic.py

  deploy:
    name: Apply implemented stacks on main
    needs: [changes, check]
    if: >-
      needs.changes.result == 'success' && needs.check.result == 'success' &&
      github.ref == 'refs/heads/main' && needs.changes.outputs.tf_apply == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.force_apply))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    concurrency:
      # Keep the existing group to serialize with bootstrap-only runs still in progress.
      group: terraform-apply-bootstrap-aws
      cancel-in-progress: false
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_ROLE_ARN: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
      TF_VAR_operator_principal_arn: ${{ vars.EKS_OPERATOR_PRINCIPAL_ARN }}
      TF_VAR_additional_operator_principal_arns: ${{ vars.EKS_ADDITIONAL_OPERATOR_PRINCIPAL_ARNS || '[]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deployment configuration
        shell: bash
        run: |
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ && "$AWS_ACCOUNT_ID" != 000000000000 ]]
          [[ -n "$AWS_REGION" && -n "$TF_STATE_BUCKET" ]]
          [[ "$AWS_ROLE_ARN" == "arn:aws:iam::$AWS_ACCOUNT_ID:role/"* ]]
      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < .terraform-version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: iris-terraform-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Initialize S3 state, plan, and apply
        run: bash scripts/tf-ci.sh apply
