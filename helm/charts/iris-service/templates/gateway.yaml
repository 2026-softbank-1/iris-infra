{{- if eq .Values.route.mode "gateway" }}
{{- $suffix := printf ".%s" .Values.route.gateway.baseDomain }}
{{- if or (not (hasSuffix $suffix .Values.route.host)) (contains "." (trimSuffix $suffix .Values.route.host)) }}
{{- fail "GCP host must be a single service label under route.gateway.baseDomain" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: https
  hostnames: [{{ .Values.route.host | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: app
          port: {{ .Values.service.port }}
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: app
spec:
  targetRef: {group: "", kind: Service, name: app}
  default:
    checkIntervalSec: 5
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 2
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        port: {{ .Values.containerPort }}
        host: {{ .Values.route.host | quote }}
        requestPath: {{ default "/" .Values.health.path | quote }}
{{- end }}
