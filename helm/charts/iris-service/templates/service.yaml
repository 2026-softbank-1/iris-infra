apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    {{- include "iris-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "iris-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
