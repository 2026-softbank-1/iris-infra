{{- $accounts := dict "api" (printf "%s-api" .Release.Name) "build-worker" "build-worker" "deploy-worker" "deploy-worker" "migration" (printf "%s-migration" .Release.Name) }}
{{- if .Values.errorAgent.enabled }}{{- $_ := set $accounts "error-agent" (printf "%s-error-agent" .Release.Name) }}{{- end }}
{{- /* Fixed name: foundation trusts and management binds Pod Identity for iris-platform/console-gateway. */}}
{{- if .Values.consoleGateway.enabled }}{{- $_ := set $accounts "console-gateway" "console-gateway" }}{{- end }}
{{- range $component, $name := $accounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "iris-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
automountServiceAccountToken: false
{{- end }}
