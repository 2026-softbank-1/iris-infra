{{- $key := include "iris-onprem-server.key" . }}
# Argo CD cluster Secret. Deploy Worker seals only `config` (bearer token and CA) with the management
# controller's certificate, strict scope argocd/cluster-onprem-{serverKey}. name and server are fixed here,
# so a data file cannot point the cluster name at another API server.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cluster-onprem-{{ $key }}
  namespace: argocd
  labels:
    {{- include "iris-onprem-server.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    config: {{ .Values.cluster.encryptedConfig | quote }}
  template:
    metadata:
      name: cluster-onprem-{{ $key }}
      namespace: argocd
      labels:
        {{- include "iris-onprem-server.labels" . | nindent 8 }}
        argocd.argoproj.io/secret-type: cluster
    type: Opaque
    data:
      name: {{ .Values.server.clusterName | quote }}
      server: {{ printf "https://iris-onprem-api-%s.argocd.svc.cluster.local:%d" $key (int .Values.server.apiPort) | quote }}
