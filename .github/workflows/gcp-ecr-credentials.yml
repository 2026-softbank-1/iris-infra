name: GCP ECR credential helper

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immutable main source SHA image after verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gcp-ecr-credentials-image
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GCP_ECR_PUBLISH_ENABLED: ${{ vars.GCP_ECR_PUBLISH_ENABLED || 'false' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify credential helper inputs
        id: changes
        run: python3 scripts/gcp-image-ci.py classify
      - name: Test credential reconciler, publishing and deployment gates without cloud credentials
        run: |
          python3 scripts/tests/test-gcp.py
          python3 scripts/tests/test-gcp-ci.py
      - name: Build required linux amd64 image without publishing
        run: docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag iris-gcp-credentials-check runtime/gcp-ecr-credentials

  publish:
    needs: verify
    if: >-
      needs.verify.result == 'success' && github.ref == 'refs/heads/main' &&
      vars.GCP_ECR_PUBLISH_ENABLED == 'true' &&
      ((github.event_name == 'push' && needs.verify.outputs.changed == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # No GitHub environment: AWS trust uses the exact main ref subject.
    permissions:
      contents: read
      id-token: write
    env:
      VERIFY_RESULT: ${{ needs.verify.result }}
      RUNTIME_CHANGED: ${{ needs.verify.outputs.changed }}
      REQUESTED_ACTION: publish
      MANUAL_PUBLISH: ${{ inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ap-northeast-2
      GCP_ECR_PUBLISH_ROLE_ARN: ${{ vars.GCP_ECR_PUBLISH_ROLE_ARN }}
      GCP_ECR_REPOSITORY: ${{ vars.GCP_ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check latest verified main and exact publisher configuration before authentication
        run: python3 scripts/gcp-image-ci.py prepare
      - name: Authenticate narrow publisher with AWS OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.GCP_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600
          role-session-name: iris-gcp-image-${{ github.run_id }}
      - name: Publish or reuse immutable SHA digest; output manual bootstrap handoff
        run: python3 scripts/gcp-image-ci.py publish
