{{- $addons := dict "aws-load-balancer-controller" (dict "repo" "https://aws.github.io/eks-charts" "version" "3.5.0" "ns" "kube-system") "metrics-server" (dict "repo" "https://kubernetes-sigs.github.io/metrics-server/" "version" "3.14.0" "ns" "kube-system") "kube-prometheus-stack" (dict "repo" "https://prometheus-community.github.io/helm-charts" "version" "91.8.2" "ns" "observability") "opentelemetry-collector" (dict "repo" "https://open-telemetry.github.io/opentelemetry-helm-charts" "version" "0.175.0" "ns" "observability") "loki" (dict "repo" "https://grafana.github.io/helm-charts" "version" "7.3.0" "ns" "observability") "sealed-secrets" (dict "repo" "https://bitnami.github.io/sealed-secrets" "version" "2.20.0" "ns" "kube-system") "argo-rollouts" (dict "repo" "https://argoproj.github.io/argo-helm" "version" "2.43.5" "ns" "kube-system") }}
{{- /* OTel collector: agent (workload) sends to gateway (management). Loki stores logs in management only. */}}
{{- /* Sealed Secrets: workload unseals user variables that Deploy Worker commits to the GitOps repo; management unseals
     the Argo cluster Secrets of user-registered on-prem servers (docs/runbooks/onprem-server-registration.md). Each has its own key. */}}
{{- /* Argo Rollouts (AWS workload only): runs the iris-service Rollout. on-prem stays on the Deployment-based chart (docs/runbooks/argo-rollouts.md). */}}
{{- $enabled := dict "management" (list "aws-load-balancer-controller" "metrics-server" "kube-prometheus-stack" "opentelemetry-collector" "loki" "sealed-secrets") "workload" (list "aws-load-balancer-controller" "metrics-server" "kube-prometheus-stack" "opentelemetry-collector" "sealed-secrets" "argo-rollouts") }}
{{- range $purpose, $target := .Values.targets }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iris-{{ $purpose }}-baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: iris-addons-{{ $purpose }}
  source:
    repoURL: {{ $.Values.repoURL | quote }}
    targetRevision: {{ $.Values.revision | quote }}
    path: helm/charts/cluster-baseline
    helm:
      releaseName: baseline
      valueFiles:
        - ../../../clusters/aws-dev-{{ $purpose }}/values/baseline.yaml
  destination:
    server: {{ $target.endpoint | quote }}
    namespace: {{ if eq $purpose "management" }}iris-platform{{ else }}iris-apps{{ end }}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
{{- range $name := index $enabled $purpose }}
{{- $addon := index $addons $name }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iris-{{ $purpose }}-{{ $name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: iris-addons-{{ $purpose }}
  sources:
    - repoURL: {{ $addon.repo | quote }}
      chart: {{ $name }}
      targetRevision: {{ $addon.version | quote }}
      helm:
        releaseName: {{ if eq $name "kube-prometheus-stack" }}monitoring{{ else }}{{ $name }}{{ end }}
        valueFiles:
          - $values/clusters/aws-dev-{{ $purpose }}/values/{{ $name }}.yaml
          {{- if and $.Values.albTraffic.enabled (eq $purpose "management") (eq $name "loki") }}
          - $values/clusters/aws-dev-management/values/loki-alb-traffic.yaml
          {{- end }}
        {{- if eq $name "aws-load-balancer-controller" }}
        parameters:
          - {name: clusterName, value: {{ $target.name | quote }}}
          - {name: region, value: {{ $target.region | quote }}}
          - {name: vpcId, value: {{ $target.vpc_id | quote }}}
        {{- end }}
    - repoURL: {{ $.Values.repoURL | quote }}
      targetRevision: {{ $.Values.revision | quote }}
      ref: values
  destination:
    server: {{ $target.endpoint | quote }}
    namespace: {{ $addon.ns }}
  {{- if eq $name "aws-load-balancer-controller" }}
  # The chart generates a new webhook certificate on every render. Keep the live one so a
  # re-sync does not leave running controllers serving a certificate the webhooks reject.
  ignoreDifferences:
    - {group: "", kind: Secret, name: aws-load-balancer-tls, namespace: kube-system, jsonPointers: [/data]}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration, name: aws-load-balancer-webhook, jqPathExpressions: [".webhooks[].clientConfig.caBundle"]}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration, name: aws-load-balancer-webhook, jqPathExpressions: [".webhooks[].clientConfig.caBundle"]}
  {{- end }}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true{{ if eq $name "aws-load-balancer-controller" }}, RespectIgnoreDifferences=true{{ end }}]
---
{{- end }}
{{- end }}
