{{- if .Values.enabled }}
{{- $repository := required "Publish collector image and set image.repository before enabling" .Values.image.repository }}
{{- $digest := required "Set the verified collector image.digest before enabling" .Values.image.digest }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alb-log-collector
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alb-log-collector-state
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alb-log-collector
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: alb-log-collector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alb-log-collector}
    spec:
      serviceAccountName: alb-log-collector
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: collector
          image: {{ printf "%s@%s" $repository $digest | quote }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: AWS_ACCOUNT_ID, value: {{ required "aws.accountId required" .Values.aws.accountId | quote }}}
            - {name: AWS_REGION, value: {{ .Values.aws.region | quote }}}
            - {name: S3_BUCKET, value: {{ required "source.bucket required" .Values.source.bucket | quote }}}
            - {name: S3_PREFIX, value: {{ required "source.prefix required" .Values.source.prefix | quote }}}
            - {name: SQS_QUEUE_URL, value: {{ required "source.queueUrl required" .Values.source.queueUrl | quote }}}
            - {name: SQS_DLQ_URL, value: {{ required "source.deadLetterQueueUrl required" .Values.source.deadLetterQueueUrl | quote }}}
            - {name: WORKLOAD_CLUSTER, value: {{ .Values.source.cluster | quote }}}
            - {name: ALB_GROUP, value: {{ .Values.source.group | quote }}}
            - {name: LOKI_PUSH_URL, value: {{ .Values.lokiPushUrl | quote }}}
            - {name: STATE_PATH, value: /state/checkpoints.sqlite}
          ports: [{name: metrics, containerPort: 8080}]
          resources: {{ toYaml .Values.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: metrics}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: metrics}, initialDelaySeconds: 30, periodSeconds: 20}
          volumeMounts: [{name: state, mountPath: /state}]
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: alb-log-collector-state}
---
apiVersion: v1
kind: Service
metadata:
  name: alb-log-collector
  labels: {app.kubernetes.io/name: alb-log-collector}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: alb-log-collector}
  ports: [{name: metrics, port: 8080, targetPort: metrics}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alb-log-collector
  labels: {release: monitoring}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: alb-log-collector}
  endpoints: [{port: metrics, interval: 30s}]
{{- if .Values.rules.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alb-traffic-rules
data:
  traffic.yaml: |
{{ .Files.Get "files/traffic.yaml" | indent 4 }}
{{- end }}
{{- end }}
