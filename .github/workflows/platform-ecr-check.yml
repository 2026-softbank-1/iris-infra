name: Platform ECR checks

on:
  pull_request:
    paths:
      - '.github/workflows/platform-ecr-check.yml'
      - 'examples/github-actions/**'
      - 'scripts/check-platform-ecr.py'
      - 'scripts/tests/test-platform-ecr.py'
      - 'scripts/tests/test-build-push-ecr.py'
      - 'terraform/config/platform-ecr-repositories.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-ecr-check.yml'
      - 'examples/github-actions/**'
      - 'scripts/check-platform-ecr.py'
      - 'scripts/tests/test-platform-ecr.py'
      - 'scripts/tests/test-build-push-ecr.py'
      - 'terraform/config/platform-ecr-repositories.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install verified linters in runner temp
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/platform-ecr-tools"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tool_dir/actionlint.tar.gz"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$tool_dir/actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$tool_dir/actionlint.tar.gz" --directory "$tool_dir" actionlint
          curl --fail --location --retry 3 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz \
            --output "$tool_dir/shellcheck.tar.gz"
          printf '%s  %s\n' \
            b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 \
            "$tool_dir/shellcheck.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$tool_dir/shellcheck.tar.gz" --directory "$tool_dir" shellcheck-v0.11.0/shellcheck
          printf '%s\n' "$tool_dir" "$tool_dir/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Validate inventory and build script behavior
        run: |
          python3 scripts/check-platform-ecr.py
          python3 scripts/tests/test-platform-ecr.py
          python3 scripts/tests/test-build-push-ecr.py
      - name: Lint workflows and Bash script
        run: |
          bash -n examples/github-actions/build-push-ecr.sh
          shellcheck examples/github-actions/build-push-ecr.sh
          actionlint .github/workflows/platform-ecr-check.yml examples/github-actions/build-push-ecr.yml
      - uses: docker/setup-buildx-action@v3
      - name: Build local scratch fixture without AWS credentials
        env:
          IRIS_ECR_DOCKER_TEST: '1'
        run: python3 scripts/tests/test-build-push-ecr.py BuildPushTest.test_real_docker_fixture_build
