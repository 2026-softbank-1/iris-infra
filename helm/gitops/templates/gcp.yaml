{{- if .Values.gcp.enabled }}
{{- $g := .Values.gcp }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: iris-addons-gcp, namespace: argocd}
spec:
  sourceRepos: [{{ .Values.repoURL | quote }}, https://bitnami.github.io/sealed-secrets]
  destinations:
    - {server: {{ $g.endpoint | quote }}, namespace: iris-system}
    - {server: {{ $g.endpoint | quote }}, namespace: kube-system}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
  namespaceResourceWhitelist:
    - {group: "", kind: ServiceAccount}
    - {group: "", kind: Service}
    - {group: "", kind: Secret}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
    - {group: apps, kind: Deployment}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: gateway.networking.k8s.io, kind: Gateway}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: iris-gcp-workload, namespace: argocd}
spec:
  project: iris-addons-gcp
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: helm/charts/gcp-workload
    helm:
      valuesObject:
        gateway:
          addressName: {{ $g.addressName | quote }}
          certificateMap: {{ $g.certificateMap | quote }}
          baseDomain: {{ $g.baseDomain | quote }}
        credentials: {{ toJson $g.credentials }}
  destination: {server: {{ $g.endpoint | quote }}, namespace: iris-system}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    managedNamespaceMetadata:
      labels: {pod-security.kubernetes.io/enforce: baseline}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: iris-gcp-sealed-secrets, namespace: argocd}
spec:
  project: iris-addons-gcp
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: "2.20.0"
      helm:
        releaseName: sealed-secrets
        valueFiles: [$values/clusters/gcp-dev-workload/values/sealed-secrets.yaml]
    - repoURL: {{ .Values.repoURL | quote }}
      targetRevision: {{ .Values.revision | quote }}
      ref: values
  destination: {server: {{ $g.endpoint | quote }}, namespace: kube-system}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: iris-svc-gcp-project, namespace: argocd}
spec:
  sourceRepos: [{{ .Values.repoURL | quote }}, {{ .Values.services.repoURL | quote }}]
  destinations: [{server: {{ $g.endpoint | quote }}, namespace: svc-*}]
  clusterResourceWhitelist: [{group: "", kind: Namespace}]
  namespaceResourceWhitelist:
    - {group: apps, kind: Deployment}
    - {group: apps, kind: ReplicaSet}
    - {group: "", kind: Pod}
    - {group: "", kind: Service}
    - {group: "", kind: Secret}
    - {group: "", kind: ResourceQuota}
    - {group: "", kind: LimitRange}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
    - {group: networking.gke.io, kind: HealthCheckPolicy}
    - {group: bitnami.com, kind: SealedSecret}
  roles:
    - name: iris-deploy-reader
      policies:
        - p, proj:iris-svc-gcp-project:iris-deploy-reader, applications, get, iris-svc-gcp-project/*, allow
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata: {name: iris-svc-gcp-appset, namespace: argocd}
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - git:
        repoURL: {{ .Values.services.repoURL | quote }}
        revision: {{ .Values.services.revision | quote }}
        directories: [{path: services/*/gcp}]
  syncPolicy: {applicationsSync: sync}
  template:
    metadata:
      name: 'gcp-svc-{{ "{{" }} index .path.segments 1 {{ "}}" }}'
      finalizers: [resources-finalizer.argocd.argoproj.io]
    spec:
      project: iris-svc-gcp-project
      sources:
        - repoURL: {{ .Values.repoURL | quote }}
          path: helm/charts/iris-service
          targetRevision: {{ $g.chartRevision | quote }}
          helm:
            valueFiles: ['$values/{{ "{{" }} .path.path {{ "}}" }}/values.yaml']
            valuesObject:
              route:
                mode: gateway
                gateway: {name: iris-gcp-apps, namespace: iris-system, baseDomain: {{ $g.baseDomain | quote }}}
              registryPull: {enabled: true}
              tenantBudget: {enabled: true}
              networkPolicy:
                allowedCidrs: [130.211.0.0/22, 35.191.0.0/16]
                egressDeniedCidrs: {{ toJson $g.deniedCidrs }}
        - repoURL: {{ .Values.services.repoURL | quote }}
          targetRevision: {{ .Values.services.revision | quote }}
          ref: values
      destination:
        server: {{ $g.endpoint | quote }}
        namespace: 'svc-{{ "{{" }} index .path.segments 1 {{ "}}" }}'
      ignoreDifferences:
        - group: ""
          kind: Secret
          name: iris-ecr-pull
          jsonPointers: [/data/.dockerconfigjson, /metadata/annotations/iris.dev~1expires-at]
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, PruneLast=true, RespectIgnoreDifferences=true]
        managedNamespaceMetadata:
          labels:
            iris.dev/target: gcp-dev-workload
            iris.dev/registry-pull: gcp
            pod-security.kubernetes.io/enforce: baseline
{{- end }}
