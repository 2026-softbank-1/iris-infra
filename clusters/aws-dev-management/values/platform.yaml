{
  "was": {
    "image": {
      "repository": "187069338876.dkr.ecr.ap-northeast-2.amazonaws.com/iris/was"
    },
    "logLevel": "INFO",
    "envSecret": "iris-platform-was-env"
  },
  "database": {
    "secret": "iris-platform-was-env",
    "urlKey": "DATABASE_URL",
    "caConfigMap": "iris-rds-ca",
    "caKey": "ca-bundle.pem"
  },
  "api": {
    "replicas": 1,
    "host": "api.likelion.uk",
    "buildLogGroup": "/aws/codebuild/iris-dev-build",
    "resources": {
      "requests": {
        "cpu": "100m",
        "memory": "256Mi"
      },
      "limits": {
        "cpu": "500m",
        "memory": "512Mi"
      }
    },
    "terminationGracePeriodSeconds": 90
  },
  "buildWorker": {
    "replicas": 1,
    "codebuildProject": "iris-dev-build",
    "artifactBucket": "iris-dev-build-artifacts-187069338876-ap-northeast-2",
    "githubSecret": "iris-build-github-app",
    "resources": {
      "requests": {
        "cpu": "100m",
        "memory": "256Mi"
      },
      "limits": {
        "cpu": "500m",
        "memory": "512Mi"
      }
    },
    "terminationGracePeriodSeconds": 120
  },
  "deployWorker": {
    "replicas": 3,
    "baseDomain": "likelion.uk",
    "gitopsRepository": "2026-softbank-1/iris-gitops-environments",
    "githubSecret": "iris-gitops-github-app",
    "argocdUrl": "https://argocd-server.argocd.svc",
    "argocdSecret": "iris-argocd-reader",
    "caConfigMap": "iris-deploy-worker-ca",
    "caKey": "ca-bundle.pem",
    "resources": {
      "requests": {
        "cpu": "100m",
        "memory": "256Mi"
      },
      "limits": {
        "cpu": "500m",
        "memory": "512Mi"
      }
    },
    "terminationGracePeriodSeconds": 60
  },
  "errorAgent": {
    "enabled": true,
    "image": {
      "repository": "187069338876.dkr.ecr.ap-northeast-2.amazonaws.com/iris/error-check-agent"
    },
    "secret": "iris-error-agent",
    "model": "gpt-6.1-sol",
    "resources": {
      "requests": {
        "cpu": "250m",
        "memory": "1Gi"
      },
      "limits": {
        "cpu": "1000m",
        "memory": "2Gi"
      }
    },
    "env": {
      "AGENT_DIAGNOSIS_MODE": "graph_compact",
      "OPENAI_SERVICE_TIER": "fast"
    }
  },
  "consoleGateway": {
    "enabled": false,
    "ticketSigningSecret": "iris-console-ticket-signer",
    "ticketPublicKey": "",
    "awsCluster": {
      "name": "iris-dev-workload",
      "endpoint": "",
      "ca": ""
    },
    "allowedOrigins": [
      "https://app.likelion.uk"
    ]
  },
  "migration": {
    "resources": {
      "requests": {
        "cpu": "100m",
        "memory": "256Mi"
      },
      "limits": {
        "cpu": "500m",
        "memory": "512Mi"
      }
    },
    "activeDeadlineSeconds": 600,
    "backoffLimit": 1
  },
  "network": {
    "albSubnetCidrs": [
      "10.40.240.0/24",
      "10.40.241.0/24"
    ],
    "rdsSubnetCidrs": [
      "10.40.0.0/20",
      "10.40.16.0/20"
    ]
  },
  "awsRegion": "ap-northeast-2"
}
